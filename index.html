<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>StudyFlow</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div><p id="todayLabel" class="eyebrow"></p><h1 id="pageTitle">ホーム</h1></div>
      <button id="themeQuick" class="icon-btn" aria-label="表示テーマを切り替える">◐</button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="メインメニュー">
      <button data-view="home" class="active"><span>⌂</span>ホーム</button>
      <button data-view="subjects"><span>▦</span>科目</button>
      <button data-view="quiz"><span>✓</span>問題</button>
      <button data-view="records"><span>▥</span>記録</button>
      <button data-view="settings"><span>⚙</span>設定</button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./questions.js"></script>
  <script src="./script.js"></script>
</body>
</html>
